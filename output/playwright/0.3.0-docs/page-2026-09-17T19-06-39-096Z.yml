- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: Версия 0.3.0 · полная миссия 2.0 · показ за 6 минут
    - heading "Прайм Planner Шпаргалка демонстрации" [level=1] [ref=e4]: Прайм PlannerШпаргалка демонстрации
    - paragraph [ref=e5]: Задание → варианты → проверки → подтверждение → симуляция → экспорт.
    - paragraph [ref=e6]: Девять синтетических сценариев показывают работу модели и причины отказа. Это собственные проверочные примеры, не официальные эталоны Геоскана и не реальные разрешённые полётные задания.
    - generic [ref=e7]:
      - link "Открыть локальный стенд" [ref=e8] [cursor=pointer]:
        - /url: http://127.0.0.1:3016/planner
      - button "Печать / сохранить PDF" [ref=e9] [cursor=pointer]
  - main [ref=e10]:
    - navigation "Разделы шпаргалки" [ref=e11]:
      - link "План показа" [ref=e12] [cursor=pointer]:
        - /url: "#run"
      - link "Возможности" [ref=e13] [cursor=pointer]:
        - /url: "#features"
      - link "9 сценариев" [ref=e14] [cursor=pointer]:
        - /url: "#scenarios"
      - link "Варианты" [ref=e15] [cursor=pointer]:
        - /url: "#compare"
      - link "Форматы" [ref=e16] [cursor=pointer]:
        - /url: "#files"
      - link "Доказательства и границы" [ref=e17] [cursor=pointer]:
        - /url: "#limits"
    - region [ref=e18]:
      - heading "Перед показом" [level=2] [ref=e19]
      - paragraph [ref=e20]:
        - text: Откройте
        - code [ref=e21]: http://127.0.0.1:3016/planner
        - text: ". При необходимости запустите из корня проекта:"
      - code [ref=e23]: docker compose -f compose.planner.yaml up --build -d
      - paragraph [ref=e24]:
        - text: Отключите подложку, если нужны только локальные данные без запросов тайлов. Подготовьте свободный ID копии, например
        - code [ref=e25]: demo-session-27
        - text: ". Основной пример — «Автовыбор БВС: время, налёт и баланс»."
      - paragraph [ref=e26]: Минуты и статусы берутся из живого расчёта. Совпадение вариантов или отсутствие полного плана в бюджете нужно показать с фактическим объяснением.
    - region [ref=e27]:
      - heading "Показ за 6 минут" [level=2] [ref=e28]
      - list [ref=e29]:
        - listitem [ref=e30]:
          - generic [ref=e31]: 0:00–0:40
          - generic [ref=e32]:
            - heading "Открыть задание и паспорт" [level=3] [ref=e33]
            - paragraph [ref=e34]: "«Сценарии» → «Автовыбор БВС: время, налёт и баланс» → предпросмотр → «Заменить текущее задание» → «Паспорт миссии»."
            - paragraph [ref=e35]: Показать номер, описание, окно, работы и ресурсы. Три совместимых БВС отличаются базой, скоростью и готовностью АКБ; назначение автоматическое.
        - listitem [ref=e36]:
          - generic [ref=e37]: 0:40–1:15
          - generic [ref=e38]:
            - heading "Сохранить отдельную миссию" [level=3] [ref=e39]
            - paragraph [ref=e40]: «Сохранить как» → новый ID и имя → «Создать новую миссию».
            - paragraph [ref=e41]: Все параметры переходят в отдельную запись. Исходная запись сохраняется; прежнее подтверждение не переносится.
        - listitem [ref=e42]:
          - generic [ref=e43]: 1:15–2:05
          - generic [ref=e44]:
            - heading "Показать ресурсы и ограничения" [level=3] [ref=e45]
            - paragraph [ref=e46]: "«Редактировать миссию» из паспорта → «Ресурсы»: параметры БВС, АКБ и группы назначений. Затем «Правила» и «Слои карты»."
            - paragraph [ref=e47]: Custom, базы, совместимость, ресурс; для 4D — контур, высоты, период действия. Для основного расчёта оставить подготовленные параметры.
        - listitem [ref=e48]:
          - generic [ref=e49]: 2:05–3:20
          - generic [ref=e50]:
            - heading "Сравнить реальные варианты" [level=3] [ref=e51]
            - paragraph [ref=e52]: «Рассчитать варианты» → «Сравнить и объяснить варианты».
            - paragraph [ref=e53]: "«Раньше закончить», «Меньше летать», доступный «Баланс»: последняя посадка, суммарный налёт, назначения, вылеты, замены АКБ и остаток."
        - listitem [ref=e54]:
          - generic [ref=e55]: 3:20–4:10
          - generic [ref=e56]:
            - heading "Проверить и проиграть" [level=3] [ref=e57]
            - paragraph [ref=e58]: Прочитать проверки и допущения, подтвердить выбранный план. Запустить симуляцию, показать паузу, скорость и конец ползунка.
            - paragraph [ref=e59]: Карта, события, заряд и экспорт используют одни вылеты. Правка входа или смена варианта сбрасывает подтверждение.
        - listitem [ref=e60]:
          - generic [ref=e61]: 4:10–5:10
          - generic [ref=e62]:
            - heading "Показать ожидание и отказ" [level=3] [ref=e63]
            - paragraph [ref=e64]: "Рассчитать «Ожидание временного запрета», затем «Отказ: ветер выше предела»."
            - paragraph [ref=e65]: В первом примере старт ждёт открытия зоны. Во втором объяснить причину отказа и недоступное подтверждение.
        - listitem [ref=e66]:
          - generic [ref=e67]: 5:10–6:00
          - generic [ref=e68]:
            - heading "Вернуться к сохранённому входу и выгрузить" [level=3] [ref=e69]
            - paragraph [ref=e70]: Через «Библиотеку» открыть основной пример, при необходимости пересчитать. Показать JSON/YAML задания, индивидуальную выдачу и «Доказательства».
            - paragraph [ref=e71]: Полный вход загружается обратно; пакет относится к конкретному расчёту и проверяется отдельной командой.
      - paragraph [ref=e72]: Для короткого показа пропустить расчёт временной зоны. Для семиминутного — дополнительно раскрыть «Повторные вылеты и смена АКБ». Все девять примеров за один проход показывать не требуется.
    - region [ref=e73]:
      - heading "Что раскрыть по вопросу" [level=2] [ref=e74]
      - generic [ref=e75]:
        - article [ref=e76]:
          - heading "Паспорт и «Сохранить как»" [level=3] [ref=e77]
          - paragraph [ref=e78]: Описание, окно, работы, ресурсы, условия и ограничения. Паспорт ведёт к редактированию и описанию MD. Новый ID создаёт отдельную запись, сохраняя полный вход.
        - article [ref=e79]:
          - heading "Редактор БВС" [level=3] [ref=e80]
          - paragraph [ref=e81]: Имя, воздушная скорость, допустимый ветер, ресурс, подъём, снижение, манёвр, базы, совместимость, источник и допущения. Custom задаётся явно; Геоскан 201 остаётся самолётом.
        - article [ref=e82]:
          - heading "АКБ и назначения" [level=3] [ref=e83]
          - paragraph [ref=e84]: Заряд, готовность, перезарядка, циклы, дата ввода и источник. Для каждой работы выбирается группа аппаратов. Пустая группа означает автоматический выбор доступных совместимых БВС.
        - article [ref=e85]:
          - heading "Удаление аппарата" [level=3] [ref=e86]
          - paragraph [ref=e87]: После подтверждения удаляются БВС, его АКБ и ссылки в назначениях. Остаются минимум один БВС и одна АКБ. Если ручная группа опустела, назначение становится автоматическим.
        - article [ref=e88]:
          - heading "Импорт и экспорт флота" [level=3] [ref=e89]
          - paragraph [ref=e90]:
            - text: JSON
            - code [ref=e91]: prime-fleet
            - text: 1.0 с предпросмотром. Импорт добавляет весь набор. Коллизия ID, превышение лимита или несохраняемый результат отменяет операцию целиком.
        - article [ref=e92]:
          - heading "Слои и 4D-объёмы" [level=3] [ref=e93]
          - paragraph [ref=e94]:
            - text: GeoJSON/KML передаёт координаты. JSON
            - code [ref=e95]: prime-restrictions
            - text: 1.0 сохраняет высоты, время и источник. Объёмы добавляются после подтверждения; коллизии ID отклоняются.
      - paragraph [ref=e96]: До 8 работ, 10 БВС, 100 АКБ и 20 дополнительных объёмов. Файлы миссии, флота и объёмов — до 200 КиБ каждый. Галерея даёт полные входы и отдельные примеры участков, объёмов и флота. Для повторного добавления нужны уникальные ID.
    - region [ref=e97]:
      - heading "Матрица девяти сценариев" [level=2] [ref=e98]
      - paragraph [ref=e99]: Это ожидаемое поведение подготовленных входов. Итог текущего прогона определяется реальным расчётом.
      - table [ref=e101]:
        - rowgroup [ref=e102]:
          - row [ref=e103]:
            - columnheader "Сценарий" [ref=e104]
            - columnheader "Что наблюдать" [ref=e105]
        - rowgroup [ref=e106]:
          - row [ref=e107]:
            - 'cell "01. Автовыбор БВС: время, налёт и баланс automatic-tradeoff" [ref=e108]':
              - text: "01. Автовыбор БВС: время, налёт и баланс"
              - generic [ref=e109]: automatic-tradeoff
            - cell "Один RGB-участок, три профиля, пустые назначения. Сравнить выбор аппаратов и три представления результата." [ref=e110]
          - row [ref=e111]:
            - cell "02. Три работы и смешанный флот mixed-fleet" [ref=e112]:
              - text: 02. Три работы и смешанный флот
              - generic [ref=e113]: mixed-fleet
            - cell "RGB, MS и IR; разные скорости, совместимость и более поздняя готовность ИК-батарей." [ref=e114]
          - row [ref=e115]:
            - cell "03. LiDAR и геофизический подвес lidar-geophysics" [ref=e116]:
              - text: 03. LiDAR и геофизический подвес
              - generic [ref=e117]: lidar-geophysics
            - cell "Правила плотности и шага измерений, учебный подвес 10 м, проверка высот." [ref=e118]
          - row [ref=e119]:
            - cell "04. Повторные вылеты и смена АКБ repeat-sorties" [ref=e120]:
              - text: 04. Повторные вылеты и смена АКБ
              - generic [ref=e121]: repeat-sorties
            - cell "Один БВС с ресурсом 12 минут; несколько вылетов, замены батарей и обслуживание." [ref=e122]
          - row [ref=e123]:
            - cell "05. Ожидание временного запрета timed-airspace" [ref=e124]:
              - text: 05. Ожидание временного запрета
              - generic [ref=e125]: timed-airspace
            - cell "Запрет до 200 м на первые 15 минут; ожидание открытия без сокращения задания." [ref=e126]
          - row [ref=e127]:
            - cell "06. Высотное препятствие под маршрутом height-obstacle" [ref=e128]:
              - text: 06. Высотное препятствие под маршрутом
              - generic [ref=e129]: height-obstacle
            - cell "Препятствие 40 м и переход на заданной высоте 100 м; вертикальный зазор." [ref=e130]
          - row [ref=e131]:
            - cell "07. Участок с внутренним отверстием area-with-hole" [ref=e132]:
              - text: 07. Участок с внутренним отверстием
              - generic [ref=e133]: area-with-hole
            - cell "Сохранение исходного Polygon с отверстием и полноты назначенных полос." [ref=e134]
          - row [ref=e135]:
            - 'cell "08. Отказ: ветер выше предела wind-limit" [ref=e136]':
              - text: "08. Отказ: ветер выше предела"
              - generic [ref=e137]: wind-limit
            - cell "Ветер 20 м/с при пределе профиля 10 м/с; полный допустимый план не ожидается." [ref=e138]
          - row [ref=e139]:
            - 'cell "09. Отказ: недостаточный ресурс insufficient-energy" [ref=e140]':
              - text: "09. Отказ: недостаточный ресурс"
              - generic [ref=e141]: insufficient-energy
            - cell "Заряд 26% при резерве 25%; полноценный вылет не ожидается." [ref=e142]
    - region [ref=e143]:
      - heading "Как объяснить три варианта" [level=2] [ref=e144]
      - paragraph [ref=e145]:
        - strong [ref=e146]: «Раньше закончить»
        - text: уменьшает время от начала окна до последней посадки. Ожидания и обслуживание между вылетами входят в расписание.
      - paragraph [ref=e147]:
        - strong [ref=e148]: «Меньше летать»
        - text: уменьшает сумму длительностей всех вылетов. Параллельные полёты складываются; суммарный налёт может отличаться от времени завершения.
      - paragraph [ref=e149]:
        - strong [ref=e150]: «Баланс»
        - text: использует равные веса этих показателей, нормализованных по найденному допустимому набору. Это выбор существующего проверенного кандидата. Он может совпасть с основным вариантом; если полного допустимого плана нет, баланс не предлагается.
      - paragraph [ref=e151]: Налёт характеризует использование ресурса, но не измеряет физический износ. Глобальная оптимальность не доказана. Выгрузка и обработка данных после последней посадки не моделируются.
    - region [ref=e152]:
      - heading "Входные и выходные форматы" [level=2] [ref=e153]
      - table [ref=e155]:
        - rowgroup [ref=e156]:
          - row [ref=e157]:
            - columnheader "Формат" [ref=e158]
            - columnheader "Для чего" [ref=e159]
            - columnheader "Обратная загрузка" [ref=e160]
        - rowgroup [ref=e161]:
          - row [ref=e162]:
            - cell "Полная миссия JSON / YAML 2.0" [ref=e163]
            - cell "Работы, геометрия, окно, флот, АКБ и ограничения" [ref=e164]
            - cell "Да, через «Импорт» и предпросмотр" [ref=e165]
          - row [ref=e166]:
            - cell "Описание MD" [ref=e167]
            - cell "Читаемый паспорт задания" [ref=e168]
            - cell "Нет; это описание, не вход" [ref=e169]
          - row [ref=e170]:
            - cell "GeoJSON / KML на входе" [ref=e171]
            - cell "Участки, границы, запреты, точки баз" [ref=e172]
            - cell "Координатный слой с выбранной ролью, не полная миссия" [ref=e173]
          - row [ref=e174]:
            - cell [ref=e175]:
              - text: Флот JSON
              - code [ref=e176]: prime-fleet
              - text: "1.0"
            - cell "Профили БВС и отдельные АКБ" [ref=e177]
            - cell "«Ресурсы» → «Импорт флота»" [ref=e178]
          - row [ref=e179]:
            - cell [ref=e180]:
              - text: Объёмы JSON
              - code [ref=e181]: prime-restrictions
              - text: "1.0"
            - cell "Контуры, высоты, периоды, источники" [ref=e182]
            - cell "«Слои карты» → «Загрузить объёмы JSON»" [ref=e183]
          - row [ref=e184]:
            - cell "GeoJSON / KML плана, «План JSON»" [ref=e185]
            - cell "Вылеты группы или выбранного БВС" [ref=e186]
            - cell "Не заменяет полный вход; совместимость с автопилотом не проверена" [ref=e187]
          - row [ref=e188]:
            - cell "«Доказательства» JSON" [ref=e189]
            - cell "Вход, результат, проверки, события, хеши и подтверждение" [ref=e190]
            - cell "Для отдельного проверяющего инструмента" [ref=e191]
      - paragraph [ref=e192]: GeoJSON/KML не загружает DEM. Картинка карты без координат не становится геоданными. Высотный объём препятствия не является цифровой моделью рельефа. KML плана прижат к земле; высоты передаются отдельными атрибутами.
    - region [ref=e193]:
      - heading "Доказательства и границы модели" [level=2] [ref=e194]
      - paragraph [ref=e195]:
        - link "Отчёт версии 0.3.0" [ref=e196] [cursor=pointer]:
          - /url: showcase-0.3.0.md
        - text: ·
        - link "Машиночитаемый свод" [ref=e197] [cursor=pointer]:
          - /url: ../../output/mission-showcase-0.3.0/summary.json
        - text: . Пакеты проверки находятся в
        - code [ref=e198]: output/mission-showcase-0.3.0/
        - text: . Число пройденных тестов и итоги следует брать из файлов фактического прогона.
      - code [ref=e200]: npm run verify:evidence -- <путь-к-пакету.json> <путь-к-отчёту.json>
      - list [ref=e201]:
        - listitem [ref=e202]: Ветер, облачность и видимость задаёт оператор; значения постоянны. Прогнозов и реальной телеметрии нет.
        - listitem [ref=e203]: Облака и траектории используют общий локальный уровень высот. Преобразования к реальным AGL/AMSL нет; рельеф неизвестный либо явно плоский.
        - listitem [ref=e204]: Заданная высота проверяется. Автоматического поиска лучшей высоты нет.
        - listitem [ref=e205]: Энергия описывается линейной моделью. Качество реальных снимков и измерений не подтверждается; самолётные фазы 201 не валидированы.
        - listitem [ref=e206]: Нет службы разрешений, управления реальным БВС, моделирования отказов и гарантии найти решение для любого входа. Неизвестные проверки остаются видимыми.
      - paragraph [ref=e207]: Библиотека привязана к браузеру и адресу. Другой порт — другое хранилище; очистка данных может удалить записи. Для переноса сохраняйте полную миссию JSON/YAML и резервную копию библиотеки.
